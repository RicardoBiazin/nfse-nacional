{% extends "base.html" %}
{% block titulo %}Entrar · NFS-e Nacional{% endblock %}
{% block conteudo %}
<div class="cartao caixa-login">
  <img src="/static/icone.png" alt="">
  <h2 style="text-align:center">NFS-e Nacional</h2>
  {% if erro %}<div class="flash erro">{{ erro }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="prox" value="{{ prox }}">
    <label for="login">Usuário</label>
    <input id="login" name="login" autocomplete="username" required autofocus>
    <label for="senha" style="margin-top:10px">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <div class="acoes"><button class="primario" style="width:100%">Entrar</button></div>
  </form>
</div>
{% endblock %}
