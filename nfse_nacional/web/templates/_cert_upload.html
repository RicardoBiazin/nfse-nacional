<form method="post" action="/empresa/certificados" enctype="multipart/form-data" class="grade">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div><label for="pfx">Arquivo .pfx / .p12</label><input id="pfx" type="file" name="pfx" accept=".pfx,.p12" required></div>
  <div><label for="senha-cert">Senha do certificado</label><input id="senha-cert" type="password" name="senha" required autocomplete="off"></div>
  <div style="display:flex;align-items:end;gap:10px">
    <label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" name="principal" value="1" style="width:auto">Tornar principal</label>
    <button class="primario">Enviar</button>
  </div>
</form>
