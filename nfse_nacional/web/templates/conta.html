{% extends "base.html" %}
{% block titulo %}Minha conta · NFS-e Nacional{% endblock %}
{% block conteudo %}
<form method="post" class="cartao" style="max-width:460px">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <h2>{{ u.nome or u.login }} <span class="mini">· {{ PAPEIS[u.papel] }}</span></h2>
  {% if erro %}<div class="flash erro">{{ erro }}</div>{% endif %}
  <label>Senha atual</label><input name="atual" type="password" required autocomplete="current-password">
  <label style="margin-top:8px">Nova senha (mín. 8, letras e números)</label><input name="nova" type="password" required autocomplete="new-password">
  <label style="margin-top:8px">Repita a nova senha</label><input name="nova2" type="password" required autocomplete="new-password">
  <div class="acoes"><button class="primario">Trocar senha</button></div>
</form>
{% endblock %}
