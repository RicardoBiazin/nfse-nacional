{% extends "base.html" %}
{% block titulo %}Primeiro acesso · NFS-e Nacional{% endblock %}
{% block conteudo %}
<div class="cartao caixa-login" style="max-width:420px">
  <img src="/static/icone.png" alt="">
  <h2 style="text-align:center">Criar o administrador</h2>
  <p class="mini">Primeira vez que o servidor é usado. Este usuário cadastra a empresa, o certificado e os demais usuários.</p>
  {% if erro %}<div class="flash erro">{{ erro }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Login</label><input name="login" required autofocus>
    <label style="margin-top:8px">Nome</label><input name="nome">
    <label style="margin-top:8px">Senha (mín. 8, letras e números)</label><input name="senha" type="password" required autocomplete="new-password">
    <label style="margin-top:8px">Repita a senha</label><input name="senha2" type="password" required autocomplete="new-password">
    <div class="acoes"><button class="primario" style="width:100%">Criar administrador</button></div>
  </form>
</div>
{% endblock %}
